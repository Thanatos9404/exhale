<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Exhale · Air observability for families</title>
    <meta
      name="description"
      content="Exhale turns live smog data into a low-exposure, low-emission daily routine for your family, and shows the exact impact of every choice."
    />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="Exhale · Air observability for families" />
    <meta
      property="og:description"
      content="Live smog forecasts, a GenAI routine planner and the impact of every choice, for families in polluted cities."
    />
    <meta property="og:type" content="website" />
    <!-- The first data requests go to these two hosts; open the connections while the app loads. -->
    <link rel="preconnect" href="https://air-quality-api.open-meteo.com" crossorigin />
    <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
    <!-- Body text is set in this one file; fetch it alongside the CSS that asks for it. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2"
      crossorigin
    />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <noscript>Exhale needs JavaScript to load live air-quality data.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
